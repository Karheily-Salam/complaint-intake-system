# Serves the built React SPA and reverse-proxies the API to FastAPI.
# The FastAPI container is never published to the host - only this Nginx is
# (compose maps host :80 -> this container's :80).

# Rate limit for the public, unauthenticated intake endpoint, which writes to
# the database. 12 requests/minute per IP with a burst of 6 absorbs a person
# clicking through the demo conversation (each reply is one request, and a
# full complaint is a handful) while making bulk abuse pointless. 10m of
# shared memory tracks roughly 160k addresses.
# Declared here at http level: files in conf.d are included inside http{}.
limit_req_zone $binary_remote_addr zone=intake:10m rate=12r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact Nginx version on responses and error pages.
    server_tokens off;

    # This deployment has no authentication, so the write endpoints behind
    # /api/ are public. Capping the request body is what stops a single
    # request storing a huge row; the API schemas enforce the same bound.
    client_max_body_size 256k;

    # Baseline hardening. The SPA loads only its own bundle, so a strict CSP
    # costs nothing and blocks any injected third-party script.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The public write endpoint gets the rate limit; everything else under
    # /api/ is read-only or authenticated, so it keeps the plain proxy.
    location = /api/v1/inbox {
        limit_req zone=intake burst=6 nodelay;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API -> FastAPI. No trailing slash on proxy_pass so the full "/api/..."
    # path is preserved (FastAPI serves under API_V1_PREFIX=/api/v1).
    # "backend" is the compose service name, resolved on Docker's network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- caching ----
    #
    # Vite fingerprints every asset (index-<hash>.js), so those files are
    # immutable and can be cached for a year. index.html is the one file that
    # must not be: it is what names the current hashed bundle, and a browser
    # holding a stale copy keeps loading the previous release's JavaScript
    # after a deploy. Without an explicit header it has only ETag and
    # Last-Modified, which lets browsers apply heuristic caching and reuse it
    # without revalidating - exactly that failure.
    #
    # NOTE: add_header does not inherit into a block that declares its own, so
    # each block below repeats the security headers from the server level.
    # Leaving them out would silently drop the CSP and framing protection for
    # the SPA's own documents and scripts.

    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;

        # Revalidate every time; 304s keep it cheap when nothing changed.
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'" always;

        # Content-addressed: a change produces a new filename, never a new body
        # under the same one.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html so client-side view state
    # works. The internal redirect re-runs location matching, so the served
    # document picks up the no-cache policy above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
