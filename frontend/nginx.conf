# Serves the built React SPA and reverse-proxies the API to FastAPI.
# The FastAPI container is never published to the host - only this Nginx is
# (compose maps host :80 -> this container's :80).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> FastAPI. No trailing slash on proxy_pass so the full "/api/..."
    # path is preserved (FastAPI serves under API_V1_PREFIX=/api/v1).
    # "backend" is the compose service name, resolved on Docker's network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SPA fallback: unknown paths return index.html so client-side view state works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
