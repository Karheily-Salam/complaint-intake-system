type: deposit
label: Deposit problem
description: >
  The customer reports a problem depositing funds (not credited, delayed,
  wrong amount, or sent to the wrong destination).

# Deposit uses a single flat set of generic fields. Available deposit methods
# differ by country/market and change over time, so the prototype does NOT model
# specific methods: "deposit_method" is a free-text field holding whatever the
# customer says they used. Method- or country-specific extra requirements can be
# added later as an optional layer over ComplaintSchema.fields_for() without
# changing the conversation engine (see spec.py module docstring).
common_fields:
  - key: user_id
    label: User ID
    type: string
    required: true
    description: The customer's account/user identifier on the platform.
    extraction_hint: A user or account ID. Often numeric or alphanumeric.
    example: "U-482913"
    validation:
      min_length: 2
      max_length: 64

  - key: account_email
    label: Account email
    type: email
    required: true
    description: The email address registered on the customer's account.
    extraction_hint: The email tied to the account, which may differ from the sender address.
    example: "jane.doe@example.com"

  - key: source_wallet_or_account
    label: Source wallet or payment account
    type: string
    required: true
    description: Where the funds were sent from (bank account, card, wallet, payment service, etc.).
    extraction_hint: >
      The origin of the deposit: a bank account (masked), card, e-wallet handle,
      crypto wallet address, or the name of a payment service.
    validation:
      min_length: 2

  - key: transaction_date
    label: Transaction date
    type: date
    required: true
    description: The date the deposit was made.
    extraction_hint: A calendar date. Accept relative references like "yesterday" if resolvable.
    example: "2026-09-08"
    validation:
      date_formats:
        - "%Y-%m-%d"
        - "%d/%m/%Y"
        - "%d.%m.%Y"

  - key: deposit_method
    label: Deposit method
    type: string
    required: true
    description: How the customer made the deposit, in their own words.
    extraction_hint: >
      Whatever the customer says they used to deposit - e.g. "bank transfer",
      "PayPal", "my local payment wallet", "Visa card". Capture it verbatim; do
      not map it to a predefined category.
    example: "bank transfer"
    validation:
      min_length: 2

  - key: problem_description
    label: Problem description
    type: text
    required: true
    description: A clear description of what went wrong with the deposit.
    extraction_hint: >
      Summarise what the customer experienced: what they expected, what happened,
      amounts, timing, and any error messages.
