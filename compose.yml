# Runs the whole stack, locally and on the VPS.
#
#   docker compose up --build        -> http://localhost/
#
# Works on a clean clone with no configuration: the application's own defaults
# (app/core/config.py) are demo-safe - mock email, rule-based AI, no mailbox,
# no credentials. A real deployment adds ./backend/.env, which is git-ignored.
#
# There is deliberately no `environment:` block here. Compose gives it higher
# precedence than `env_file:`, so defaults written there silently override a
# real deployment's backend/.env - which on this project set ENVIRONMENT back
# to "local" and, worse, planted a publicly-known STAFF_API_KEY on production
# and would have forced EMAIL_PROVIDER back to "mock" once a real mailbox was
# configured. Configuration belongs in backend/.env or in the application
# defaults, never here.
#
# NETWORKING / PORTS
# This stack publishes NO host ports. On the VPS the shared edge proxy
# (/opt/infra/edge, Caddy) is the only thing bound to :80/:443; it reaches this
# stack over the external `edge` network using the alias `complaint-intake-web`
# and terminates TLS for startplus.tech.
#   - `backend` stays on the private `default` network only: unreachable from
#     the proxy, from other projects, and from the host.
#   - Locally, `edge` will not exist. Run the local override instead:
#       docker compose -f compose.yml -f compose.local.yml up --build
#     which publishes the frontend on http://localhost/ as before.

services:
  backend:
    build: ./backend
    image: complaint-intake-backend:latest
    restart: unless-stopped
    env_file:
      # Optional on purpose. Without `required: false` a fresh clone fails at
      # `docker compose up` before anything starts, because this file is
      # git-ignored and so never exists on a first checkout.
      - path: ./backend/.env
        required: false
    volumes:
      # Persist the SQLite database (DATABASE_URL=sqlite:////app/data/complaint_intake.db).
      - backend_data:/app/data
    expose:
      - "8000"
    networks:
      - default
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Safety net, not a real-world constraint: this service typically uses
    # ~60MB. The host has 2GB RAM shared with other projects, so a runaway leak
    # in any one service should not be able to take the whole box down.
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  frontend:
    build: ./frontend
    image: complaint-intake-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    networks:
      default:
      edge:
        aliases:
          # Unique per project. This is what the edge proxy routes to; every
          # project must pick its own <project>-web alias.
          - complaint-intake-web
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

networks:
  # Private to this stack; Compose creates/destroys it with the project.
  default:
  # Shared proxy network, created once by hand and owned by no project:
  #   docker network create edge
  edge:
    external: true

volumes:
  backend_data:
