# Runs the whole stack, locally and on the VPS.
#
#   docker compose up --build        -> http://localhost/
#
# Works on a clean clone with no configuration: the defaults below are enough
# for a demo (mock email, no mailbox, no credentials). A real deployment adds
# ./backend/.env, which is git-ignored and overrides anything here.
#
# Only the frontend (Nginx) is published, on host port 80. FastAPI is reachable
# only on the internal compose network as "backend:8000".

services:
  backend:
    build: ./backend
    image: complaint-intake-backend:latest
    restart: unless-stopped
    env_file:
      # Optional on purpose. Without `required: false` a fresh clone fails at
      # `docker compose up` before anything starts, because this file is
      # git-ignored and so never exists on a first checkout.
      - path: ./backend/.env
        required: false
    environment:
      # Demo-safe defaults; every one is overridden by backend/.env when present.
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/complaint_intake.db}
      RUN_MIGRATIONS_ON_STARTUP: ${RUN_MIGRATIONS_ON_STARTUP:-true}
      AI_PROVIDER: ${AI_PROVIDER:-rule_based}
      # Never a real mailbox by default - a clone must not be able to send mail.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DEBUG: ${DEBUG:-false}
      # Not a secret: it only unlocks the staff API on a throwaway local demo.
      # Production sets a generated value in backend/.env.
      STAFF_API_KEY: ${STAFF_API_KEY:-local-demo-key}
    volumes:
      # Persist the SQLite database (DATABASE_URL=sqlite:////app/data/complaint_intake.db).
      - backend_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health').read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    # Safety net, not a real-world constraint: this service typically uses
    # ~60MB. The host has 2GB RAM shared with other future projects, so a
    # runaway leak in any one service should not be able to take the whole
    # box down. Raise if a real workload ever needs more.
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

  frontend:
    build: ./frontend
    image: complaint-intake-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M

volumes:
  backend_data:
